<!DOCTYPE html>
<html>
<head>
	<title></title>
	<link rel="stylesheet" type="text/css" href="./style.css">
	<style>
		.interactive-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px;
		}
		.interactive-item > *:not(:last-child) {
			margin-right: 10px;
		}
		.interactive-item input,
		.interactive-item textarea,
		.interactive-item button {
			padding: 5px;
		}
	</style>
</head>
<body>

<div class="list" id="list1">
	<div class="interactive-item">
		<span>Item 1</span>
		<input type="text" placeholder="Input field">
	</div>
	<div class="interactive-item">
		<span>Item 2</span>
		<textarea placeholder="Textarea" rows="1"></textarea>
	</div>
	<div class="interactive-item">
		<span>Item 3</span>
		<button>Button</button>
	</div>
	<div class="interactive-item">
		<span>Item 4</span>
		<select>
			<option>Option 1</option>
			<option>Option 2</option>
			<option>Option 3</option>
		</select>
	</div>
	<div class="interactive-item">
		<span>Item 5</span>
		<a href="https://github.com/SortableJS/Sortable" target="_blank">Link</a>
	</div>
</div>

<script src="../Sortable.js"></script>

<script type="text/javascript">
	new Sortable(document.getElementById('list1'), {
		draggable: '.interactive-item',
		animation: 150
	});
</script>

</body>
</html>
